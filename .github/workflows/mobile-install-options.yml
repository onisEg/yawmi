name: Mobile install options contract

on:
  push:
    branches:
      - feat/android-mobile-download-prompt
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  mobile-install-offer:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test APK-only Android offer, official release validation, and updates
        run: node --test tests/mobile-install-offer.test.mjs
      - name: Check install markup remains in a single HTML document
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const html=fs.readFileSync('index.html','utf8');
          for(const id of ['installBanner','installApkBtn','installDismiss','installBannerSub']){
            assert.equal(html.split('id="'+id+'"').length,2,id+' must have exactly one element');
          }
          assert.equal(html.split('<html lang="ar" dir="rtl">').length,2);
          JS
