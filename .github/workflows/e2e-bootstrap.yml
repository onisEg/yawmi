name: Bootstrap Playwright dependency and lockfile
on:
  push:
    branches:
      - feat/qa-e2e-sync-live-focus-beta
permissions:
  contents: write
concurrency:
  group: bootstrap-e2e-${{ github.ref }}
  cancel-in-progress: true
jobs:
  deps:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Add Playwright with resolved npm lockfile
        run: npm install --save-dev @playwright/test@latest --no-audit --no-fund
      - name: Validate existing TypeScript and unit regression suite
        run: npm test
      - name: Commit pinned package versions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "build(test): lock Playwright test runner"
          git push origin HEAD:refs/heads/feat/qa-e2e-sync-live-focus-beta
