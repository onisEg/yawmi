name: Android build and data safety checks

on:
  push:
    branches:
      - feat/android-capacitor-foundation
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out the Android feature branch
        uses: actions/checkout@v4

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install JavaScript dependencies (locked when available)
        run: |
          npm install --no-audit --no-fund

      - name: Run offline and cloud-merge safety regression tests
        run: npm test

      - name: Configure Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android API 36 platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Generate Capacitor Android project when missing
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Sync staged assets into Android
        run: npx cap sync android

      - name: Generate Yawmi native launcher and splash assets from its existing logo
        run: |
          mkdir -p assets
          cp icon-512.png assets/logo.png
          npx --yes @capacitor/assets@3.0.5 generate --android \
            --iconBackgroundColor '#F5F3EC' \
            --iconBackgroundColorDark '#14161F' \
            --splashBackgroundColor '#F5F3EC' \
            --splashBackgroundColorDark '#14161F'
          rm assets/logo.png

      - name: Build unsigned debug APK (test only)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Keep debug APK for manual installation and testing
        uses: actions/upload-artifact@v4
        with:
          name: yawmi-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Commit verified native project and exact dependency lockfile
        if: github.event_name == 'push' && github.ref == 'refs/heads/feat/android-capacitor-foundation'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android/ package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(android): track tested native project and dependency lockfile"
            git push origin HEAD:feat/android-capacitor-foundation
          else
            echo "Native source and lockfile already up to date."
          fi
