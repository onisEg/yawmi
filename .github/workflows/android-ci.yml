name: Android build and data safety checks

on:
  push:
    branches:
      - feat/android-capacitor-foundation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out the Android feature branch
        uses: actions/checkout@v4

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund

      - name: Run offline and cloud-merge safety regression tests
        run: npm test

      - name: Configure Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android API 36 platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Generate a clean Capacitor Android project
        run: npx cap add android

      - name: Sync staged assets into Android
        run: npx cap sync android

      - name: Build unsigned debug APK (test only)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Keep debug APK for manual installation and testing
        uses: actions/upload-artifact@v4
        with:
          name: yawmi-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
