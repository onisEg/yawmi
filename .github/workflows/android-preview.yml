name: Android side-by-side preview APK

on:
  push:
    branches:
      - feat/native-safe-area-and-modularization-plan
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out Android improvements
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install pinned dependencies
        run: npm ci --no-audit --no-fund

      - name: Run unit and asset tests
        run: npm test

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android API 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Set a separate package ID for this throwaway preview
        run: |
          python3 - <<'PY'
          from pathlib import Path
          gradle = Path('android/app/build.gradle')
          s = gradle.read_text()
          old = 'applicationId "in.yawmi.app"'
          assert s.count(old) == 1
          gradle.write_text(s.replace(old, 'applicationId "in.yawmi.app.preview"'))
          strings = Path('android/app/src/main/res/values/strings.xml')
          t = strings.read_text()
          assert '<string name="app_name">يومي</string>' in t
          assert '<string name="title_activity_main">يومي</string>' in t
          t = t.replace('<string name="app_name">يومي</string>', '<string name="app_name">يومي - تجربة</string>')
          t = t.replace('<string name="title_activity_main">يومي</string>', '<string name="title_activity_main">يومي - تجربة</string>')
          strings.write_text(t)
          PY

      - name: Build separately installable debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload preview APK
        uses: actions/upload-artifact@v4
        with:
          name: yawmi-android-safe-area-preview-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
          if-no-files-found: error
