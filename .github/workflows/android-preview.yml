name: Android side-by-side preview APK

on:
  push:
    branches:
      - feat/native-safe-area-and-modularization-plan
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out Android improvements
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install pinned dependencies
        run: npm ci --no-audit --no-fund

      - name: Run unit and asset tests
        run: npm test

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android API 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Set a separate package ID for this throwaway preview
        run: |
          python3 - <<'PY'
          from pathlib import Path
          gradle = Path('android/app/build.gradle')
          s = gradle.read_text()
          old = 'applicationId "in.yawmi.app"'
          assert s.count(old) == 1
          gradle.write_text(s.replace(old, 'applicationId "in.yawmi.app.qa"'))
          strings = Path('android/app/src/main/res/values/strings.xml')
          t = strings.read_text()
          assert '<string name="app_name">يومي</string>' in t
          assert '<string name="title_activity_main">يومي</string>' in t
          t = t.replace('<string name="app_name">يومي</string>', '<string name="app_name">يومي - اختبار</string>')
          t = t.replace('<string name="title_activity_main">يومي</string>', '<string name="title_activity_main">يومي - اختبار</string>')
          strings.write_text(t)
          PY

      - name: Verify unique app ID before assembly
        run: |
          grep -q 'applicationId "in.yawmi.app.qa"' android/app/build.gradle
          grep -q 'namespace = "in.yawmi.app"' android/app/build.gradle

      - name: Build separately installable debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload preview APK
        uses: actions/upload-artifact@v4
        with:
          name: yawmi-android-safe-area-preview-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
          if-no-files-found: error

      - name: Install and open preview on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          script: |
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            adb shell pm path in.yawmi.app.qa
            adb logcat -c
            adb shell am start -W -n in.yawmi.app.qa/in.yawmi.app.MainActivity
            sleep 22
            adb shell pidof in.yawmi.app.qa
            adb exec-out screencap -p > yawmi-preview-launch.png
            adb shell uiautomator dump /sdcard/preview.xml
            adb pull /sdcard/preview.xml yawmi-preview-window.xml
            adb logcat -d -v time > yawmi-preview-logcat.txt
            adb logcat -d -s AndroidRuntime:E > yawmi-preview-crash.txt
            test ! -s yawmi-preview-crash.txt

      - name: Save preview Android screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yawmi-preview-emulator-qa
          path: |
            yawmi-preview-launch.png
            yawmi-preview-window.xml
            yawmi-preview-logcat.txt
            yawmi-preview-crash.txt
          if-no-files-found: warn
          retention-days: 7

